<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monad 红包 · Red Packet</title>
    <meta name="description" content="Send and claim MON red packets on Monad — lucky draw or equal split, public or password-protected.">
    <meta name="theme-color" content="#6E54FF">
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <meta property="og:title" content="Monad 红包 · Red Packet">
    <meta property="og:description" content="A Web3 red packet DApp built on Monad Mainnet.">
    <meta property="og:image" content="./assets/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        monad: {
                            purple: '#6E54FF',
                            dark: '#0E091C',
                            cyan: '#85E6FF',
                            ink: '#05040A',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Outfit', 'Inter', 'sans-serif'],
                        mono: ['Roboto Mono', 'ui-monospace', 'monospace'],
                    },
                    boxShadow: {
                        glow: '0 0 40px rgba(110, 84, 255, 0.35)',
                        card: '0 18px 50px rgba(5, 4, 10, 0.45)',
                    }
                }
            }
        };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>
    <script src="https://unpkg.com/web3modal@1.9.12/dist/index.js"></script>
    <style>
        :root {
            --monad-purple: #6E54FF;
            --monad-dark: #0E091C;
            --monad-cyan: #85E6FF;
        }
        html, body {
            background: #05040A;
            color: #F7F5FF;
        }
        .mesh {
            background:
                radial-gradient(900px 420px at 12% -10%, rgba(110, 84, 255, 0.38), transparent 55%),
                radial-gradient(700px 380px at 92% 8%, rgba(133, 230, 255, 0.16), transparent 50%),
                radial-gradient(800px 500px at 50% 110%, rgba(110, 84, 255, 0.22), transparent 55%),
                #05040A;
        }
        .diamond-grid {
            background-image:
                linear-gradient(rgba(110, 84, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(110, 84, 255, 0.07) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
            transform: rotate(45deg) scale(1.35);
        }
        .glass {
            background: rgba(14, 9, 28, 0.72);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(110, 84, 255, 0.22);
        }
        .envelope-flap {
            clip-path: polygon(0 0, 50% 68%, 100% 0);
        }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fade-in-down { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scale-up { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(110, 84, 255, 0.45); }
            50% { box-shadow: 0 0 28px 4px rgba(110, 84, 255, 0.28); }
        }
        .animate-fade-in { animation: fade-in 0.2s ease-out; }
        .animate-fade-in-down { animation: fade-in-down 0.3s ease-out; }
        .animate-scale-up { animation: scale-up 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        .animate-float { animation: float 5.5s ease-in-out infinite; }
        .animate-pulse-glow { animation: pulse-glow 2.8s ease-in-out infinite; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .web3modal-modal-lightbox {
            z-index: 10000 !important;
            background: rgba(5, 4, 10, 0.78) !important;
            backdrop-filter: blur(10px);
        }
        .web3modal-modal-card {
            background: #0E091C !important;
            border: 1px solid rgba(110, 84, 255, 0.4) !important;
            border-radius: 20px !important;
            box-shadow: 0 18px 50px rgba(5, 4, 10, 0.55) !important;
            max-width: 400px !important;
        }
        .web3modal-provider-wrapper {
            border: none !important;
            padding: 8px 14px !important;
        }
        .web3modal-provider-container {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(110, 84, 255, 0.22) !important;
            border-radius: 16px !important;
            padding: 14px 16px !important;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }
        .web3modal-provider-container:hover {
            background: rgba(110, 84, 255, 0.18) !important;
            border-color: rgba(110, 84, 255, 0.55) !important;
            transform: translateY(-1px);
        }
        .web3modal-provider-name {
            color: #F7F5FF !important;
            font-family: Outfit, Inter, sans-serif !important;
            font-weight: 700 !important;
        }
        .web3modal-provider-description {
            color: rgba(247, 245, 255, 0.5) !important;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input, textarea { color-scheme: dark; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        if (typeof ethers === 'undefined') {
            console.error('Ethers library failed to load!');
            document.getElementById('root').innerHTML = '<div style="padding: 48px; text-align: center; color: #85E6FF; font-family: Inter, sans-serif;"><h1>Ethers.js failed to load</h1><p>Please refresh, or check your network connection.</p></div>';
            throw new Error('Ethers library is not loaded');
        }

        const { useState, useEffect } = React;

        const twPx = (cls, fallback) => {
            if (!cls) return fallback;
            const m = String(cls).match(/\bw-(\d+(?:\.\d+)?)/);
            if (!m) return fallback;
            return parseFloat(m[1]) * 4;
        };
        const SvgIcon = ({ className, d, size }) => {
            const px = size || twPx(className, 20);
            return (
                <svg
                    className={className}
                    width={px}
                    height={px}
                    style={{ width: px, height: px, minWidth: px, minHeight: px, flexShrink: 0, display: 'block' }}
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d={d} />
                </svg>
            );
        };
        const Wallet = (props) => <SvgIcon size={props.size || 16} className={props.className} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />;
        const Gift = (props) => <SvgIcon size={props.size} className={props.className} d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />;
        const History = (props) => <SvgIcon size={props.size} className={props.className} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />;
        const Send = (props) => <SvgIcon size={props.size} className={props.className} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />;
        const Lock = (props) => <SvgIcon size={props.size} className={props.className} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />;
        const Globe = (props) => <SvgIcon size={props.size} className={props.className} d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />;
        const RefreshCw = (props) => <SvgIcon size={props.size} className={props.className} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />;
        const CheckCircle = (props) => <SvgIcon size={props.size} className={props.className} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />;
        const XCircle = (props) => <SvgIcon size={props.size} className={props.className} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />;
        const ExternalLink = (props) => <SvgIcon size={props.size || 14} className={props.className} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />;
        const MonadMark = (props) => {
            const px = props.size || twPx(props.className, 28);
            return (
                <svg
                    className={props.className}
                    width={px}
                    height={px}
                    style={{ width: px, height: px, minWidth: px, minHeight: px, flexShrink: 0, display: 'block' }}
                    viewBox="0 0 64 64"
                    fill="none"
                    aria-hidden="true"
                >
                    <path fill="currentColor" fillRule="evenodd" d="M18.5 6h27C54.4 6 61 12.6 61 21.5v21c0 8.9-6.6 15.5-15.5 15.5h-27C9.6 58 3 51.4 3 42.5v-21C3 12.6 9.6 6 18.5 6zm2.2 14.8h22.6c4.7 0 8.5 3.8 8.5 8.5v15.4c0 4.7-3.8 8.5-8.5 8.5H20.7c-4.7 0-8.5-3.8-8.5-8.5V29.3c0-4.7 3.8-8.5 8.5-8.5z" />
                </svg>
            );
        };

        let web3ModalSingleton = null;
        const getWeb3Modal = () => {
            if (web3ModalSingleton) return web3ModalSingleton;
            if (!window.Web3Modal) return null;
            const Web3ModalLib = window.Web3Modal.default || window.Web3Modal;
            const WalletConnectProvider = window.WalletConnectProvider
                ? (window.WalletConnectProvider.default || window.WalletConnectProvider)
                : null;
            const providerOptions = {};
            if (WalletConnectProvider) {
                providerOptions.walletconnect = {
                    package: WalletConnectProvider,
                    options: {
                        rpc: { [MONAD_CHAIN_ID]: RPC_URL },
                        chainId: MONAD_CHAIN_ID
                    }
                };
            }
            web3ModalSingleton = new Web3ModalLib({
                cacheProvider: true,
                providerOptions,
                theme: {
                    background: 'rgb(14, 9, 28)',
                    main: 'rgb(247, 245, 255)',
                    secondary: 'rgb(133, 230, 255)',
                    border: 'rgba(110, 84, 255, 0.45)',
                    hover: 'rgb(26, 19, 48)'
                }
            });
            return web3ModalSingleton;
        };

        const MONAD_CHAIN_ID = 143;
        const MONAD_CHAIN_ID_HEX = '0x8f';
        const RPC_URL = 'https://rpc.monad.xyz';
        const EXPLORER_URL = 'https://monadvision.com';
        const CHAIN_NAME = 'Monad';

        const CONTRACT_ADDRESS = '0xd4288501bf594eAE9C8093Caa8667C50375E8611';

        const CONTRACT_ABI = [
            "function createPacket(uint256 count, uint8 packetType, uint8 accessType, string memory password) external payable returns (uint256)",
            "function claimPacket(uint256 packetId, string memory password) external",
            "function getPacket(uint256 packetId) external view returns (address sender, uint256 totalAmount, uint256 remainingAmount, uint256 totalCount, uint256 remainingCount, uint8 packetType, uint8 accessType, uint256 timestamp, bool active)",
            "function getPacketClaims(uint256 packetId) external view returns (tuple(address claimer, uint256 amount, uint256 timestamp)[])",
            "function getUserSentPackets(address user) external view returns (uint256[])",
            "function getUserReceivedPackets(address user) external view returns (uint256[])",
            "function getRecentActivePackets(uint256 limit) external view returns (uint256[])",
            "function nextPacketId() external view returns (uint256)",
            "event PacketCreated(uint256 indexed packetId, address indexed sender, uint256 totalAmount, uint256 count, uint8 packetType, uint8 accessType)",
            "event PacketClaimed(uint256 indexed packetId, address indexed claimer, uint256 amount)"
        ];

        const shortenAddress = (addr) => {
            if (!addr) return '';
            return `${addr.substring(0, 6)}...${addr.substring(addr.length - 4)}`;
        };

        const explorerAddress = (addr) => `${EXPLORER_URL}/address/${addr}`;

        function MonadRedPacket() {
            const [walletAddress, setWalletAddress] = useState('');
            const [balance, setBalance] = useState('0.00');
            const [activeTab, setActiveTab] = useState('home');
            const [loading, setLoading] = useState(false);
            const [notification, setNotification] = useState(null);

            const [packets, setPackets] = useState([]);
            const [userHistory, setUserHistory] = useState({ sent: [], received: [] });

            const [provider, setProvider] = useState(null);
            const [rawProvider, setRawProvider] = useState(null);
            const [signer, setSigner] = useState(null);
            const [contract, setContract] = useState(null);
            const [connectedWalletType, setConnectedWalletType] = useState('');

            const [formData, setFormData] = useState({
                totalAmount: '',
                count: '',
                type: 'random',
                accessType: 'public',
                password: ''
            });

            const [claimPassword, setClaimPassword] = useState('');
            const [selectedPacket, setSelectedPacket] = useState(null);

            const addMonadNetwork = async (requestProvider) => {
                await requestProvider.request({
                    method: 'wallet_addEthereumChain',
                    params: [{
                        chainId: MONAD_CHAIN_ID_HEX,
                        chainName: CHAIN_NAME,
                        rpcUrls: [RPC_URL, 'https://rpc3.monad.xyz'],
                        nativeCurrency: {
                            name: 'Monad',
                            symbol: 'MON',
                            decimals: 18,
                        },
                        blockExplorerUrls: [EXPLORER_URL],
                    }],
                });
            };

            const connectWallet = async () => {
                const modal = getWeb3Modal();
                if (!modal) {
                    showNotification('error', '钱包连接组件加载失败，请刷新页面');
                    return;
                }

                setLoading(true);
                try {
                    const instance = await modal.connect();
                    const isWalletConnect = !!(instance && (instance.wc || instance.bridge));
                    setRawProvider(instance);
                    setConnectedWalletType(isWalletConnect ? 'walletconnect' : 'injected');

                    if (instance && instance.request) {
                        try {
                            await instance.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: MONAD_CHAIN_ID_HEX }],
                            });
                        } catch (switchError) {
                            if (switchError && switchError.code === 4902) {
                                try {
                                    await addMonadNetwork(instance);
                                } catch (addError) {
                                    showNotification('error', '添加 Monad 网络失败');
                                    setLoading(false);
                                    return;
                                }
                            }
                        }
                    }

                    const web3Provider = new ethers.providers.Web3Provider(instance);
                    const web3Signer = web3Provider.getSigner();
                    const address = await web3Signer.getAddress();
                    setWalletAddress(address);
                    setSigner(web3Signer);
                    setProvider(web3Provider);

                    const redPacketContract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, web3Signer);
                    setContract(redPacketContract);

                    const bal = await web3Provider.getBalance(address);
                    setBalance(ethers.utils.formatEther(bal));

                    showNotification('success', '已连接到 Monad');

                    await loadPackets(redPacketContract);
                    await loadUserHistory(redPacketContract, address);
                } catch (error) {
                    console.error('钱包连接错误:', error);
                    const msg = (error && error.message) ? error.message : String(error || '');
                    if (!/user closed|modal closed|User rejected|closed by user/i.test(msg)) {
                        showNotification('error', error.message || '连接被拒绝');
                    }
                } finally {
                    setLoading(false);
                }
            };

            const disconnectWallet = async () => {
                try {
                    const modal = getWeb3Modal();
                    if (modal) modal.clearCachedProvider();
                    if (rawProvider) {
                        if (rawProvider.disconnect) await rawProvider.disconnect();
                        else if (rawProvider.close) await rawProvider.close();
                    }
                } catch (e) {
                    console.error(e);
                }

                setWalletAddress('');
                setBalance('0.00');
                setProvider(null);
                setRawProvider(null);
                setSigner(null);
                setContract(null);
                setConnectedWalletType('');
                setPackets([]);
                setUserHistory({ sent: [], received: [] });

                showNotification('success', '钱包已断开');
            };

            const loadPackets = async (contractInstance) => {
                try {
                    const packetIds = await contractInstance.getRecentActivePackets(50);
                    const packetPromises = packetIds.map(async (id) => {
                        const packet = await contractInstance.getPacket(id);
                        return {
                            id: id.toString(),
                            sender: packet.sender,
                            totalAmount: ethers.utils.formatEther(packet.totalAmount),
                            remainingAmount: ethers.utils.formatEther(packet.remainingAmount),
                            totalCount: packet.totalCount.toNumber(),
                            remainingCount: packet.remainingCount.toNumber(),
                            type: packet.packetType === 0 ? 'random' : 'equal',
                            accessType: packet.accessType === 0 ? 'public' : 'password',
                            timestamp: new Date(packet.timestamp.toNumber() * 1000).toISOString(),
                            active: packet.active
                        };
                    });
                    const loadedPackets = await Promise.all(packetPromises);
                    setPackets(loadedPackets);
                } catch (error) {
                    console.error('加载红包失败:', error);
                }
            };

            const loadUserHistory = async (contractInstance, address) => {
                try {
                    const sentIds = await contractInstance.getUserSentPackets(address);
                    const sentPromises = sentIds.map(async (id) => {
                        const packet = await contractInstance.getPacket(id);
                        return {
                            id: id.toString(),
                            sender: packet.sender,
                            totalAmount: ethers.utils.formatEther(packet.totalAmount),
                            remainingAmount: ethers.utils.formatEther(packet.remainingAmount),
                            totalCount: packet.totalCount.toNumber(),
                            remainingCount: packet.remainingCount.toNumber(),
                            type: packet.packetType === 0 ? 'random' : 'equal',
                            accessType: packet.accessType === 0 ? 'public' : 'password',
                            timestamp: new Date(packet.timestamp.toNumber() * 1000).toISOString()
                        };
                    });
                    const sent = await Promise.all(sentPromises);

                    const receivedIds = await contractInstance.getUserReceivedPackets(address);
                    const receivedPromises = receivedIds.map(async (id) => {
                        const packet = await contractInstance.getPacket(id);
                        const claims = await contractInstance.getPacketClaims(id);
                        const userClaim = claims.find(c => c.claimer.toLowerCase() === address.toLowerCase());

                        return {
                            packetId: id.toString(),
                            sender: packet.sender,
                            amount: userClaim ? ethers.utils.formatEther(userClaim.amount) : '0',
                            timestamp: userClaim ? new Date(userClaim.timestamp.toNumber() * 1000) : new Date()
                        };
                    });
                    const received = await Promise.all(receivedPromises);

                    setUserHistory({ sent, received });
                } catch (error) {
                    console.error('加载历史失败:', error);
                }
            };

            const handleCreatePacket = async () => {
                if (!walletAddress) return showNotification('error', '请先连接钱包');
                if (!contract) return showNotification('error', '合约未初始化');
                if (!formData.totalAmount || !formData.count) return showNotification('error', '请填写完整信息');

                const amount = parseFloat(formData.totalAmount);
                const count = parseInt(formData.count);

                if (amount <= 0) return showNotification('error', '金额必须大于0');
                if (count <= 0 || count > 100) return showNotification('error', '红包数量必须在1-100之间');
                if (amount > parseFloat(balance)) return showNotification('error', '余额不足');

                setLoading(true);
                try {
                    const packetType = formData.type === 'random' ? 0 : 1;
                    const accessType = formData.accessType === 'public' ? 0 : 1;
                    const password = formData.password || '';
                    const amountWei = ethers.utils.parseEther(amount.toString());

                    const tx = await contract.createPacket(
                        count,
                        packetType,
                        accessType,
                        password,
                        { value: amountWei }
                    );

                    showNotification('success', '交易已提交，等待 Monad 确认...');
                    await tx.wait();

                    showNotification('success', '红包发送成功！');

                    await loadPackets(contract);
                    await loadUserHistory(contract, walletAddress);

                    const bal = await provider.getBalance(walletAddress);
                    setBalance(ethers.utils.formatEther(bal));

                    setFormData({
                        totalAmount: '',
                        count: '',
                        type: 'random',
                        accessType: 'public',
                        password: ''
                    });
                    setActiveTab('home');
                } catch (error) {
                    console.error('创建红包失败:', error);
                    showNotification('error', error.reason || error.message || '创建红包失败');
                } finally {
                    setLoading(false);
                }
            };

            const handleClaimPacket = async (packetId, passwordInput = '') => {
                if (!walletAddress) return showNotification('error', '请先连接钱包');
                if (!contract) return showNotification('error', '合约未初始化');

                setLoading(true);
                try {
                    const tx = await contract.claimPacket(packetId, passwordInput);
                    showNotification('success', '交易已提交，等待 Monad 确认...');
                    const receipt = await tx.wait();

                    const claimEvent = receipt.events?.find(e => e.event === 'PacketClaimed');
                    let claimAmount = '0';
                    if (claimEvent) {
                        claimAmount = ethers.utils.formatEther(claimEvent.args.amount);
                    }

                    showNotification('success', `成功抢到 ${claimAmount} MON`);

                    await loadPackets(contract);
                    await loadUserHistory(contract, walletAddress);

                    const bal = await provider.getBalance(walletAddress);
                    setBalance(ethers.utils.formatEther(bal));

                    setSelectedPacket(null);
                    setClaimPassword('');
                } catch (error) {
                    console.error('领取红包失败:', error);
                    let errorMsg = '领取红包失败';
                    if (error.reason) {
                        errorMsg = error.reason;
                    } else if (error.message) {
                        if (error.message.includes('Already claimed')) errorMsg = '你已经领取过该红包了';
                        else if (error.message.includes('Packet is empty')) errorMsg = '手慢了，红包已抢完';
                        else if (error.message.includes('Wrong password')) errorMsg = '口令错误';
                        else if (error.message.includes('Sender cannot claim')) errorMsg = '不能领取自己的红包';
                    }
                    showNotification('error', errorMsg);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (contract && walletAddress) {
                    const interval = setInterval(async () => {
                        await loadPackets(contract);
                    }, 10000);
                    return () => clearInterval(interval);
                }
            }, [contract, walletAddress]);

            useEffect(() => {

                        </button>
                        <div className="w-px bg-white/15 h-6"></div>
                        <button onClick={() => setActiveTab('send')} className={`flex items-center space-x-2 font-semibold transition ${activeTab === 'send' ? 'text-monad-cyan' : 'text-white/40 hover:text-white'}`}>
                            <Send size={18} /> <span>发红包</span>
                        </button>
                        <div className="w-px bg-white/15 h-6"></div>
                        <button onClick={() => setActiveTab('history')} className={`flex items-center space-x-2 font-semibold transition ${activeTab === 'history' ? 'text-monad-cyan' : 'text-white/40 hover:text-white'}`}>
                            <History size={18} /> <span>记录</span>
                        </button>
                    </div>

                    {selectedPacket && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
                            <div className="w-full max-w-sm rounded-3xl overflow-hidden relative animate-scale-up border border-monad-purple/40 shadow-glow bg-[#0E091C]">
                                <button
                                    onClick={() => setSelectedPacket(null)}
                                    className="absolute top-4 right-4 text-white/50 hover:text-white z-10"
                                >
                                    <XCircle className="w-6 h-6" />
                                </button>
                                <div className="bg-gradient-to-br from-rose-500 to-monad-purple p-8 text-center">
                                    <div className="w-16 h-16 bg-white/15 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                        <Lock className="w-8 h-8" />
                                    </div>
                                    <h3 className="font-display text-xl font-bold">口令红包</h3>
                                    <p className="text-white/80 text-sm mt-1">输入正确口令，在 Monad 上开抢</p>
                                </div>
                                <div className="p-6">
                                    <input
                                        type="text"
                                        placeholder="请输入口令"
                                        value={claimPassword}
                                        onChange={(e) => setClaimPassword(e.target.value)}
                                        className="w-full text-center text-lg bg-transparent border-b border-white/20 pb-2 mb-6 focus:border-monad-cyan focus:outline-none transition"
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter') {
                                                handleClaimPacket(selectedPacket.id, claimPassword);
                                            }
                                        }}
                                    />
                                    <button
                                        onClick={() => handleClaimPacket(selectedPacket.id, claimPassword)}
                                        disabled={loading}
                                        className="w-full bg-gradient-to-r from-rose-500 to-monad-purple text-white py-3 rounded-2xl font-bold hover:brightness-110 transition disabled:opacity-50"
                                    >
                                        {loading ? '开启中...' : '开红包'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.render(<MonadRedPacket />, document.getElementById('root'));
    </script>
</body>
</html>
